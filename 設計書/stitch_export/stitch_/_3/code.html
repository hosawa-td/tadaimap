<!-- Step Progression Indicator -->
<div class="pt-space-md pb-space-sm flex items-center justify-between">
<div class="inline-flex items-center gap-space-xs px-space-sm py-1 rounded-full bg-secondary-fixed text-on-secondary-fixed-variant">

</div>
<span class="font-label-md text-label-md text-on-surface-variant">グループの初期設定</span>
</div>
<!-- Progress Bar (Subtle & Warm) -->
<div class="w-full h-1.5 rounded-full bg-surface-container-high overflow-hidden mb-space-lg">
<div class="h-full w-1/2 rounded-full bg-secondary-container transition-all duration-500 ease-out"></div>
</div>
<!-- Warm Illustration / Delight Card -->
<div class="relative w-full rounded-lg bg-surface-container-low p-space-md mb-space-lg shadow-sm flex items-center gap-space-md overflow-hidden">
<div class="w-16 h-16 rounded-full bg-secondary-fixed flex items-center justify-center shrink-0 text-secondary">
<span class="material-symbols-outlined text-[32px]">diversity_3</span>
</div>
<div class="flex flex-col min-w-0 pr-2">
<h2 class="font-headline-sm text-headline-sm text-primary font-bold leading-tight">家族の輪をつくろう</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">招待コードを伝えるだけで、家族とつながることができます。</p>
</div>
<!-- Decorative Warm Glow SVG Graphic -->
<div class="absolute -right-4 -bottom-6 w-24 h-24 pointer-events-none opacity-40">
<svg class="w-full h-full" fill="none" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="#ffb233" r="45"></circle>
<circle cx="65" cy="45" fill="#ffddb3" r="30"></circle>
</svg>
</div>
</div>
<!-- Invite Code Card (Level 1 Elevation) -->
<div class="w-full bg-surface-container-lowest rounded-lg p-space-lg shadow-[0_4px_24px_-4px_rgba(24,36,48,0.06)] flex flex-col mb-space-lg">
<div class="flex items-center justify-between mb-space-sm">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px] text-secondary">key</span>
        グループ招待コード
      </span>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-tertiary-fixed text-on-tertiary-fixed font-label-sm text-label-sm">
        有効期限：7日間
      </span>
</div>
<!-- Code Display Area -->
<div class="bg-surface-container-low rounded-DEFAULT p-space-md my-space-xs flex items-center justify-between">
<div class="flex items-baseline gap-1 pl-2">
<span class="font-headline-lg text-headline-lg tracking-widest text-primary font-bold" id="invite-code-text">842-915</span>
</div>
<button class="h-11 px-space-md rounded-full bg-surface-container-lowest text-primary shadow-sm hover:bg-surface-container active:scale-95 transition-all flex items-center gap-1.5 group select-none" id="copy-code-btn" onclick="copyCode()" type="button">
<span class="material-symbols-outlined text-[20px] text-secondary transition-transform" id="copy-icon">content_copy</span>
<span class="font-label-lg text-label-lg text-primary font-bold" id="copy-label">コピー</span>
</button>
</div>
<!-- Instruction Subtext -->
<div class="flex items-start gap-space-xs mt-space-sm">
<span class="material-symbols-outlined text-[18px] text-secondary mt-0.5 shrink-0">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">
        家族にこのコードを共有して参加してもらいましょう。LINEやメッセージでそのまま貼り付けて送れます。
      </p>
</div>
</div>
<!-- Name Input Section -->
<div class="w-full bg-surface-container-lowest rounded-lg p-space-lg shadow-[0_4px_24px_-4px_rgba(24,36,48,0.06)] flex flex-col mb-space-xl">
<label class="font-title-md text-title-md text-primary font-bold mb-space-xs flex items-center gap-2" for="user-name-input">
<span class="material-symbols-outlined text-[20px] text-secondary">person</span>
      あなたの名前
    </label>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-space-md">
      家族に表示されるニックネームです（あとから変更もできます）。
    </p>
<div class="relative w-full">
<input class="w-full h-[52px] px-space-md pr-12 rounded-DEFAULT bg-surface-container-lowest text-primary font-body-lg text-body-lg placeholder:text-outline/60 outline-none shadow-[inset_0_0_0_2px_#182430] focus:shadow-[inset_0_0_0_2px_#ffb233] transition-all duration-200" id="user-name-input" maxlength="16" oninput="handleNameInput(this.value)" placeholder="例：お父さん、たかし" type="text"/>
<button class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-surface-container text-outline hover:text-primary items-center justify-center transition-colors" id="clear-name-btn" onclick="clearNameInput()" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<!-- Friendly Presets -->
<div class="mt-space-md flex flex-wrap items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant mr-1">おすすめ：</span>
<button class="px-3 py-1.5 rounded-full bg-surface-container-low text-primary font-label-md text-label-md hover:bg-surface-container active:scale-95 transition-all" onclick="setPreset('お父さん')" type="button">お父さん</button>
<button class="px-3 py-1.5 rounded-full bg-surface-container-low text-primary font-label-md text-label-md hover:bg-surface-container active:scale-95 transition-all" onclick="setPreset('お母さん')" type="button">お母さん</button>
<button class="px-3 py-1.5 rounded-full bg-surface-container-low text-primary font-label-md text-label-md hover:bg-surface-container active:scale-95 transition-all" onclick="setPreset('じぃじ')" type="button">じぃじ</button>
<button class="px-3 py-1.5 rounded-full bg-surface-container-low text-primary font-label-md text-label-md hover:bg-surface-container active:scale-95 transition-all" onclick="setPreset('ばぁば')" type="button">ばぁば</button>
</div>
</div>
<!-- Proceed Button (Responsive to validation) -->
<div class="w-full flex flex-col items-center">
<button class="w-full h-[52px] rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 opacity-40 cursor-not-allowed shadow-[0_8px_20px_-4px_rgba(24,36,48,0.2)] transition-all duration-200 active:scale-[0.98]" disabled="" id="submit-step-btn" onclick="proceedToHomeSetup()" type="button">
<span>次へ進む（自宅の設定へ）</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="font-label-sm text-label-sm text-outline mt-space-sm text-center">
      名前を入力すると次に進めます
    </p>
</div>
</div>
<!-- Floating Toast for Copy Action -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-primary-container text-on-primary px-space-md py-space-sm rounded-full shadow-lg flex items-center gap-2 pointer-events-none opacity-0 translate-y-3 transition-all duration-300" id="copy-toast">
<span class="material-symbols-outlined text-[18px] text-secondary-container">check_circle</span>
<span class="font-label-md text-label-md">招待コードをコピーしました</span>
</div>
<script>
  function handleNameInput(val) {
    const trimmed = val.trim();
    const btn = document.getElementById('submit-step-btn');
    const clearBtn = document.getElementById('clear-name-btn');

    if (trimmed.length > 0) {
      btn.disabled = false;
      btn.classList.remove('opacity-40', 'cursor-not-allowed');
      btn.classList.add('opacity-100', 'cursor-pointer');
      clearBtn.classList.remove('hidden');
      clearBtn.classList.add('flex');
    } else {
      btn.disabled = true;
      btn.classList.add('opacity-40', 'cursor-not-allowed');
      btn.classList.remove('opacity-100', 'cursor-pointer');
      clearBtn.classList.add('hidden');
      clearBtn.classList.remove('flex');
    }
  }

  function setPreset(name) {
    const input = document.getElementById('user-name-input');
    input.value = name;
    handleNameInput(name);
    input.focus();
  }

  function clearNameInput() {
    const input = document.getElementById('user-name-input');
    input.value = '';
    handleNameInput('');
    input.focus();
  }

  function copyCode() {
    const code = document.getElementById('invite-code-text').innerText;
    
    // Copy clipboard implementation
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code);
    }

    // UI feedback
    const copyLabel = document.getElementById('copy-label');
    const copyIcon = document.getElementById('copy-icon');
    const toast = document.getElementById('copy-toast');

    copyLabel.innerText = '完了!';
    copyIcon.innerText = 'check';
    copyIcon.classList.add('text-secondary-container');

    toast.classList.remove('opacity-0', 'translate-y-3');
    toast.classList.add('opacity-100', 'translate-y-0');

    setTimeout(() => {
      copyLabel.innerText = 'コピー';
      copyIcon.innerText = 'content_copy';
      copyIcon.classList.remove('text-secondary-container');
      toast.classList.remove('opacity-100', 'translate-y-0');
      toast.classList.add('opacity-0', 'translate-y-3');
    }, 2200);
  }

  function proceedToHomeSetup() {
    const input = document.getElementById('user-name-input');
    if (!input.value.trim()) return;
    
    // Smooth press sensation feedback
    const btn = document.getElementById('submit-step-btn');
    btn.classList.add('scale-95');
    setTimeout(() => {
      btn.classList.remove('scale-95');
      // Navigation hook or confirmation flow
    }, 150);
  }
</script></main></body></html>
