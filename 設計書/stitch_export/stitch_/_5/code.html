text-[24px]">arrow_back_ios_new</span></button><h1 class="font-title-lg text-title-lg text-primary truncate max-w-[200px]">Register Home</h1></div><div class="flex items-center"><img alt="Profile" class="w-8 h-8 rounded-full object-cover shadow-[0_2px_8px_rgba(24,36,48,0.08)]" src="https://lh3.googleusercontent.com/aida/AEtjO1XFv94ryUmxnI9HnehjoXfY2jUBroC_YfTmTLgYqPcb8-ser81LhAlk8CVcBqFnOTnAwr_NGfjAj23i7m9XqyDHD-AcLVOWUBWse7yfXKBvqzjdj2QdyKoywYmG-gNdRJKGytxEM_ohl5Os9NOJ0AOeKzjDp8Snssz-JXZnJ4aYXQF5XH2Qa_9wIIAPMUgTRbes5CRzoFb0tj2dLr4YbEkROOanIrNLLGbT1aY3FV-02l0pC6uaNlGA5ag"/></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-background"><div class="flex flex-col w-full">
<!-- Content Body -->
<div class="px-margin pt-space-md pb-32 flex flex-col gap-space-lg">
<!-- Title & Gentle Intro -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center gap-space-xs text-secondary mb-1">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">home_pin</span>
<span class="font-label-md text-label-md uppercase tracking-wider text-secondary">Presence Geofence</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-primary">自宅の位置と判定範囲</h2>
<p class="font-body-md text-body-md text-on-surface-variant">自宅を中心とした円の内側にいるとき、家族アプリ上で自動的に「在宅」と判定されます。</p>
</div>
<!-- Map Preview Canvas Card -->
<div class="relative w-full rounded-3xl overflow-hidden bg-surface-container shadow-[0_8px_30px_rgba(24,36,48,0.06)]">
<!-- Location Map Placeholder with Static Pipeline -->
<div class="w-full h-80 bg-cover bg-center transition-transform duration-700" data-location="Setagaya, Tokyo, Japan" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuApviCYPkZeQlIao9b60SDYBrPxj2ttMJ8t5E7RmzjnUUs1L4Pvw4aIEiJJvDUkYHqvPSSXe9BM49l9S17DfR0OMRc__zNQ9T2hfO8hSt-dehk1aCwN-_DsRR_lEVFarOexGEu2a4wvAVOfGFRTakmmQD31WNi2DqLirGjttk78fZE7UkrzHFGni86hMKMaZuCgRfDCKvkMT2-Fbt43qQWdjkBire6KU2tEJ163R79XyER4qUf_IqIv')">
<!-- Soft Tinted Overlay for domestic atmosphere -->
<div class="absolute inset-0 bg-primary/5 pointer-events-none"></div>
<!-- Center Radius Pulse Visualization -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<!-- Dynamic Geofence Circle -->
<div class="rounded-full bg-secondary-container/25 flex items-center justify-center transition-all duration-300 ease-out shadow-[0_0_0_2px_rgba(217,146,10,0.6)]" id="geofence-circle" style="width: 140px; height: 140px;">
<!-- Ambient Ripple Effect Ring -->
<div class="w-full h-full rounded-full animate-ping opacity-30 bg-secondary-container"></div>
</div>
<!-- Home Pin Marker Centerpiece -->
<div class="absolute -translate-y-3 flex flex-col items-center drop-shadow-[0_8px_16px_rgba(24,36,48,0.25)] transition-transform active:scale-95">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-[26px]" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<!-- Pin Pointer Triangle -->
<div class="w-0 h-0 border-x-[6px] border-x-transparent border-t-[8px] border-t-primary-container -mt-0.5"></div>
<!-- Pin Shadow Dot on ground -->
<div class="w-4 h-1.5 rounded-full bg-primary/20 mt-0.5 blur-[1px]"></div>
</div>
</div>
<!-- Floating Quick Action: Current Location Button -->
<div class="absolute bottom-4 inset-x-4 flex items-center justify-between pointer-events-auto">
<!-- Accuracy / Location badge -->
<div class="bg-surface-container-lowest/90 backdrop-blur-md px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
<span class="w-2 h-2 rounded-full bg-on-tertiary-container animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">GPS高精度モード</span>
</div>
<!-- Fetch Current Location Button -->
<button class="bg-surface-container-lowest text-primary px-4 py-2.5 rounded-full flex items-center gap-2 shadow-[0_6px_20px_rgba(24,36,48,0.12)] active:scale-95 transition-all font-label-md text-label-md" id="btn-gps" type="button">
<span class="material-symbols-outlined text-[20px] text-secondary">my_location</span>
<span>現在地を設定</span>
</button>
</div>
</div>
</div>
<!-- Interactive Geofence Radius Slider Card -->
<div class="bg-surface-container-lowest rounded-3xl p-5 shadow-[0_4px_24px_-2px_rgba(24,36,48,0.04)] flex flex-col gap-4">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-[22px]">radar</span>
<span class="font-title-md text-title-md text-primary">在宅と判定する半径</span>
</div>
<!-- Value pill badge -->
<div class="bg-secondary-fixed/50 px-3 py-1 rounded-full flex items-center gap-1.5">
<span class="font-headline-sm text-headline-sm text-on-secondary-fixed-variant leading-none" id="radius-val">100m</span>
<span class="font-label-sm text-label-sm text-secondary font-bold" id="recommend-badge">おすすめ</span>
</div>
</div>
<!-- Slider Control -->
<div class="relative py-2 flex flex-col gap-2">
<input class="w-full h-2.5 bg-surface-variant rounded-full appearance-none cursor-pointer accent-secondary-container focus:outline-none" id="radius-range" max="300" min="50" step="25" type="range" value="100"/>
<!-- Scale Notch Labels -->
<div class="flex justify-between px-1 text-outline">
<span class="font-label-sm text-label-sm">50m (狭い)</span>
<span class="font-label-sm text-label-sm font-bold text-secondary">100m</span>
<span class="font-label-sm text-label-sm">200m</span>
<span class="font-label-sm text-label-sm">300m (広い)</span>
</div>
</div>
<!-- Helpful Advice Box -->
<div class="bg-surface-container-low rounded-2xl p-3.5 flex items-start gap-2.5">
<span class="material-symbols-outlined text-secondary text-[18px] mt-0.5 shrink-0">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
          ※広すぎると近所でも「在宅」扱いになり、狭すぎると建物内のGPS誤差で「不在」に切り替わる場合があります。戸建やマンションでは<span class="text-primary font-bold">100m〜150m</span>が最適です。
        </p>
</div>
</div>
<!-- Registered Place Name Input Card -->
<div class="bg-surface-container-lowest rounded-3xl p-5 shadow-[0_4px_24px_-2px_rgba(24,36,48,0.04)] flex flex-col gap-3">
<label class="font-title-md text-title-md text-primary flex items-center gap-2" for="place-name">
<span class="material-symbols-outlined text-secondary text-[20px]">edit_location_alt</span>
<span>スポットの名称</span>
</label>
<div class="bg-surface-container-low rounded-full px-4 h-12 flex items-center">
<input class="w-full bg-transparent font-body-md text-body-md text-primary placeholder:text-outline focus:outline-none" id="place-name" placeholder="例: おうち、実家" type="text" value="自宅"/>
</div>
</div>
</div>
<!-- Bottom Floating Action Dock -->
<div class="fixed bottom-0 inset-x-0 bg-surface/90 backdrop-blur-xl pb-safe shadow-[0_-8px_24px_rgba(0,0,0,0.05)] px-margin pt-3 pb-6 z-40">
<button class="w-full h-[52px] bg-primary-container active:bg-on-primary-fixed-variant text-on-primary font-label-lg text-label-lg rounded-2xl flex items-center justify-center gap-2 shadow-[0_8px_20px_rgba(24,36,48,0.18)] transition-all active:scale-[0.98]" id="save-button" type="button">
<span class="material-symbols-outlined text-[22px]">check_circle</span>
<span>この位置で保存する</span>
</button>
</div>
</div>
<script>
  (function() {
    const slider = document.getElementById('radius-range');
    const display = document.getElementById('radius-val');
    const badge = document.getElementById('recommend-badge');
    const circle = document.getElementById('geofence-circle');
    const gpsBtn = document.getElementById('btn-gps');
    const saveBtn = document.getElementById('save-button');

    if (slider && display && circle) {
      slider.addEventListener('input', function(e) {
        const val = parseInt(e.target.value, 10);
        display.textContent = val + 'm';

        // Toggle recommended indicator
        if (val === 100) {
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }

        // Map visual size: min 50m -> 90px, max 300m -> 220px
        const minPx = 90;
        const maxPx = 220;
        const mappedSize = minPx + ((val - 50) / (300 - 50)) * (maxPx - minPx);
        circle.style.width = mappedSize + 'px';
        circle.style.height = mappedSize + 'px';
      });
    }

    if (gpsBtn) {
      gpsBtn.addEventListener('click', function() {
        const originalText = gpsBtn.innerHTML;
        gpsBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span><span>取得中...</span>';
        setTimeout(function() {
          gpsBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] text-on-tertiary-container">done</span><span>現在地を反映</span>';
          setTimeout(function() {
            gpsBtn.innerHTML = originalText;
          }, 2000);
        }, 600);
      });
    }

    if (saveBtn) {
      saveBtn.addEventListener('click', function() {
        saveBtn.classList.add('scale-95');
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[22px] animate-spin">sync</span><span>登録中...</span>';
        setTimeout(function() {
          saveBtn.innerHTML = '<span class="material-symbols-outlined text-[22px]">task_alt</span><span>自宅を設定しました</span>';
          saveBtn.classList.remove('bg-primary-container');
          saveBtn.classList.add('bg-on-tertiary-container');
        }, 800);
      });
    }
  })();
</script></main></body></html>
