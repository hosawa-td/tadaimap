<script>
  (function() {
    const copyBtn = document.getElementById('copy-code-btn');
    const copyIcon = document.getElementById('copy-icon');
    const tadaimaBtn = document.getElementById('tadaima-action-btn');
    const toast = document.getElementById('toast-banner');

    if (copyBtn && copyIcon) {
      copyBtn.addEventListener('click', function() {
        navigator.clipboard?.writeText('842-915');
        copyIcon.textContent = 'check';
        copyIcon.classList.add('text-secondary');
        setTimeout(() => {
          copyIcon.textContent = 'content_copy';
          copyIcon.classList.remove('text-secondary');
        }, 2000);
      });
    }

    if (tadaimaBtn && toast) {
      tadaimaBtn.addEventListener('click', function() {
        toast.classList.remove('hidden');
        requestAnimationFrame(() => {
          toast.classList.remove('opacity-0');
        });
        tadaimaBtn.disabled = true;
        tadaimaBtn.classList.add('opacity-75');

        setTimeout(() => {
          toast.classList.add('opacity-0');
          setTimeout(() => {
            toast.classList.add('hidden');
            tadaimaBtn.disabled = false;
            tadaimaBtn.classList.remove('opacity-75');
          }, 300);
        }, 3000);
      });
    }
  })();
