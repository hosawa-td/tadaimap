ll="#000" font-weight="400" text-anchor="start">status</text><text x="130" y="264" font-size="14" fill="#000" font-weight="400" text-anchor="start">home（もう一方は away）</text><path d="M318 253h14M318 259h14M318 265h14" stroke="#C7C7CC" stroke-width="1.6"/><circle cx="34" cy="295" r="9" fill="#E53935"/><path d="M29 295h10" stroke="#fff" stroke-width="2"/><text x="52" y="300" font-size="14.5" fill="#000" font-weight="400" text-anchor="start">source</text><text x="130" y="300" font-size="14" fill="#000" font-weight="400" text-anchor="start">auto</text><path d="M318 289h14M318 295h14M318 301h14" stroke="#C7C7CC" stroke-width="1.6"/><circle cx="34" cy="331" r="9" fill="#E53935"/><path d="M29 331h10" stroke="#fff" stroke-width="2"/><text x="52" y="336" font-size="14.5" fill="#000" font-weight="400" text-anchor="start">trigger</text><rect x="130" y="321" width="144.0" height="22" rx="7" fill="#E6F0FF"/><text x="137" y="338" font-size="13" fill="#0A7AFF" font-weight="500" text-anchor="start">ショートカットの入力</text><path d="M318 325h14M318 331h14M318 337h14" stroke="#C7C7CC" stroke-width="1.6"/><circle cx="34" cy="367" r="9" fill="#34C759"/><path d="M29 367h10M34 362v10" stroke="#fff" stroke-width="2"/><text x="52" y="372" font-size="14" fill="#8E8E93" font-weight="400" text-anchor="start">新規フィールドを追加</text><text x="14" y="394.0" font-size="11.5" fill="#D1342A" font-weight="500" text-anchor="start">※If の中は status＝home、その他の場合の中は status＝away。</text><text x="14" y="409.5" font-size="11.5" fill="#D1342A" font-weight="500" text-anchor="start">　それ以外（方法・本文・4つのキー）は2つとも同じです</text><text x="14" y="425.0" font-size="11.5" fill="#D1342A" font-weight="500" text-anchor="start">※triggerを入れると、図1の一番上の</text><text x="14" y="440.5" font-size="11.5" fill="#D1342A" font-weight="500" text-anchor="start">　「受け取る」部品が自動で付きます（無視してOK）</text></svg>