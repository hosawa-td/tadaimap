<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 736" width="360" height="736" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" role="img" aria-label="図1 確認用ショートカットの全体"><rect width="360" height="736" rx="16" fill="#F2F2F7"/><circle cx="34" cy="30" r="18" fill="#fff" stroke="#E5E5EA"/><path d="M38 22l-8 8l8 8" stroke="#000" stroke-width="2" fill="none"/><text x="186.0" y="36" font-size="16" fill="#000" font-weight="700" text-anchor="middle">ただいマップ確認</text><circle cx="326" cy="30" r="18" fill="#0A7AFF"/><path d="M318 30l6 6l11-12" stroke="#fff" stroke-width="2.4" fill="none"/><rect x="12" y="62" width="336" height="100" rx="14" fill="#fff" stroke="#F0A8A0" stroke-width="1"/><rect x="24" y="74" width="26" height="26" rx="7" fill="#0A7AFF"/><path d="M37.0 80.0v10m-5-5l5 5l5-5" stroke="#fff" stroke-width="2" fill="none"/><rect x="58" y="77" width="66.0" height="22" rx="7" fill="#EEF1F5"/><text x="65" y="94" font-size="13" fill="#6B7A90" font-weight="500" text-anchor="start">指定なし</text><text x="130.0" y="92" font-size="14" fill="#000" font-weight="400" text-anchor="start">から</text><rect x="24" y="105" width="133.07999999999998" height="22" rx="7" fill="#E6F0FF"/><text x="31" y="122" font-size="13" fill="#0A7AFF" font-weight="500" text-anchor="start">アプリ、その他18個</text><text x="163.07999999999998" y="120" font-size="14" fill="#000" font-weight="400" text-anchor="start">を受け取る</text><text x="24" y="144" font-size="12" fill="#8E8E93" font-weight="400" text-anchor="start">もし入力がない場合：</text><text x="150" y="144" font-size="12" fill="#0A7AFF" font-weight="500" text-anchor="start">続ける</text><rect x="12" y="170" width="336" height="64" rx="10" fill="#FDEDEB"/><text x="22" y="189.0" font-size="11.5" fill="#D1342A" font-weight="500" text-anchor="start">↑ triggerに「ショートカットの入力」を入れると</text><text x="22" y="204.5" font-size="11.5" fill="#D1342A" font-weight="500" text-anchor="start">　自動で付く部品です。そのままで大丈夫です</text><text x="22" y="220.0" font-size="11.5" fill="#D1342A" font-weight="500" text-anchor="start">　（無視してOK。消さないでください）</text><rect x="12" y="244" width="336" height="76" rx="14" fill="#fff"/><rect x="24" y="256" width="26" height="26" rx="7" fill="#0A7AFF"/><circle cx="37.0" cy="269.0" r="7" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M30.0 269.0h14M37.0 262.0v14" stroke="#fff" stroke-width="1.2"/><text x="58" y="274" font-size="14" fill="#0A7AFF" font-weight="400" text-anchor="start">Wi-Fi</text><text x="98.6" y="274" font-size="14" fill="#000" font-weight="400" text-anchor="start"> ネットワークの</text><text x="204.72" y="274" font-size="14" fill="#0A7AFF" font-weight="400" text-anchor="start"> ネットワーク名</text><text x="24" y="304" font-size="14" fill="#000" font-weight="400" text-anchor="start">を取得</text><rect x="12" y="330" width="336" height="88" rx="14" fill="#fff"/><rect x="24" y="342" width="26" height="26" rx="7" fill="#8E8E93"/><path d="M31.0 349.0l6 6l6-6M37.0 355.0v8" stroke="#fff" stroke-width="2" fill="none"/><rect x="58" y="346.5" width="135.5" height="22.5" rx="7" fill="#E6F0FF"/><text x="65" y="364" font-size="13.5" fill="#0A7AFF" font-weight="500" text-anchor="start">ネットワークの詳細</text><text x="24" y="396" font-size="14" fill="#0A7AFF" font-weight="400" text-anchor="start">が次と等しい</text><rect x="114.0" y="380.5" width="107.14999999999999" height="22.5" rx="7" fill="#E6F0FF"/><text x="121.0" y="398" font-size="13.5" fill="#0A7AFF" font-weight="500" text-anchor="start">自宅のWi-Fi名</text><text x="227.14999999999998" y="396" font-size="14" fill="#000" font-weight="400" text-anchor="start">の場合</text><text x="269.15" y="396" font-size="14" fill="#0A7AFF" font-weight="400" text-anchor="start">  ＋</text><rect x="30" y="426" width="318" height="66" rx="14" fill="#fff"/><text x="42" y="452" font-size="13.5" fill="#0A7AFF" font-weight="400" text-anchor="start">①送信先URLのコピー</text><text x="173.49" y="452" font-size="13.5" fill="#000" font-weight="400" text-anchor="start">　の内容を取得 ⌄</text><text x="42" y="478" font-size="12" fill="#D1342A" font-weight="500" text-anchor="start">status ＝ home（図2）</text><rect x="12" y="502" width="336" height="44" rx="14" fill="#fff"/><rect x="24" y="511" width="26" height="26" rx="7" fill="#8E8E93"/><path d="M31.0 518.0l6 6l6-6M37.0 524.0v8" stroke="#fff" stroke-width="2" fill="none"/><text x="58" y="530" font-size="14.5" fill="#000" font-weight="400" text-anchor="start">その他の場合</text><rect x="30" y="556" width="318" height="66" rx="14" fill="#fff"/><text x="42" y="582" font-size="13.5" fill="#0A7AFF" font-weight="400" text-anchor="start">①送信先URLのコピー</text><text x="173.49" y="582" font-size="13.5" fill="#000" font-weight="400" text-anchor="start">　の内容を取得 ⌄</text><text x="42" y="608" font-size="12" fill="#D1342A" font-weight="500" text-anchor="start">status ＝ away（図2）</text><rect x="12" y="632" width="336" height="44" rx="14" fill="#fff"/><rect x="24" y="641" width="26" height="26" rx="7" fill="#8E8E93"/><path d="M31.0 648.0l6 6l6-6M37.0 654.0v8" stroke="#fff" stroke-width="2" fill="none"/><text x="58" y="660" font-size="14.5" fill="#000" font-weight="400" text-anchor="start">If 文の終了</text><text x="14" y="698.0" font-size="11.5" fill="#D1342A" font-weight="500" text-anchor="start">※Wi-Fi名が少しでも違うと、自宅にいても away が送られます</text></svg>