<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>
  :root{
    --bg:#FDF8F0;
    --surface:#FFFFFF;
    --surface-sand:#F5E6D3;
    --primary:#182430;
    --on-primary:#FFFFFF;
    --accent:#D9920A;
    --on-accent:#FFFFFF;
    /* 3つの状態は「色相」と「塗り方」の両方で見分けられるようにしている
       在宅=緑のべた塗り / 施設内=橙の淡い塗り+太枠 / 外出中=青みスレートの白地+破線 */
    --home:#2F8F5B;
    --home-soft:rgba(47,143,91,0.12);
    --nearby:#D98200;
    --nearby-soft:rgba(240,160,20,0.22);
    --nearby-text:#8A5200;
    --away:#5A7391;
    --away-soft:rgba(90,115,145,0.12);
    --text:#1D1C17;
    --text-muted:#44474B;
    --text-faint:#7D8A99;
    --border:#E7E2DA;
    --danger:#BA1A1A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:480px;margin:0 auto;padding:24px 20px calc(40px + env(safe-area-inset-bottom, 0px));min-height:100%;}
  h1{font-size:22px;margin:8px 0 4px;}
  .lead{font-size:13.5px;color:var(--text-muted);line-height:1.7;margin:0 0 20px;}
  .badge{display:inline-flex;align-items:center;gap:6px;background:var(--surface-sand);color:var(--primary);font-size:12px;font-weight:700;padding:6px 12px;border-radius:100px;margin-bottom:16px;}
  .home-header-row{display:flex;align-items:center;justify-content:space-between;}
  .refresh-button{
    flex:none;border:1.5px solid var(--border);border-radius:100px;background:var(--surface);
    color:var(--text);font-size:13px;font-weight:700;padding:7px 14px;cursor:pointer;margin-bottom:16px;
  }
  .refresh-button:disabled{opacity:.5;cursor:not-allowed;}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--text-muted);margin:16px 0 6px;letter-spacing:.02em;}
  input[type="text"]{
    width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);
    background:var(--surface);color:var(--text);font-size:16px;outline:none;
  }
  input[type="text"]:focus{border-color:var(--accent);}
  .hint{font-size:12px;color:var(--text-faint);margin-top:6px;line-height:1.6;}
  .btn{
    appearance:none;border:none;border-radius:100px;padding:14px 18px;font-size:15px;font-weight:700;
    cursor:pointer;width:100%;margin-top:18px;
  }
  .btn-primary{background:var(--primary);color:var(--on-primary);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-accent{background:var(--accent);color:var(--on-accent);}
  .btn-outline{background:transparent;color:var(--text);border:1.5px solid var(--border);}
  .btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger);}
  .card{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px -2px rgba(24,36,48,0.05);touch-action:pan-y;}
  .card.dragging{box-shadow:0 10px 28px -4px rgba(24,36,48,0.3);z-index:50;position:relative;}
  .drag-handle{flex:none;width:26px;height:44px;margin:-8px -6px -8px -4px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:18px;line-height:1;cursor:grab;touch-action:none;}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--surface-sand);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;}
  .avatar.anon{background:var(--away-soft);color:var(--text-muted);}
  /* 上部の状態選択ボタン(選択中)と同じ配色: 淡い背景 + 状態色の枠線・文字 */
  .avatar.home{background:var(--home);color:#fff;border:2.5px solid var(--home);}
  .avatar.nearby{background:var(--nearby-soft);color:var(--nearby-text);border:2.5px solid var(--nearby);}
  .avatar.away{background:var(--surface);color:var(--away);border:2.5px dashed var(--away);}
  .info{flex:1;min-width:0;}
  .name-row{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14.5px;}
  .me-tag{font-size:10px;font-weight:700;color:var(--text-faint);background:var(--surface-sand);border-radius:6px;padding:1px 6px;}
  .admin-tag{font-size:10px;font-weight:700;color:var(--home);background:var(--home-soft);border-radius:6px;padding:1px 6px;}
  .time{font-size:12px;color:var(--text-faint);margin-top:2px;}
  .home-detail{font-size:12px;color:var(--accent);font-weight:700;margin-top:2px;}
  .home-detail-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .home-detail-row input[type="text"]{flex:1;text-align:center;padding:10px 14px;}
  .home-detail-clear{
    flex:none;width:32px;height:32px;border-radius:100px;border:1.5px solid var(--border);
    background:var(--surface);color:var(--text-muted);font-size:16px;font-weight:700;cursor:pointer;
  }
  .home-detail-clear:disabled{color:var(--text-faint);cursor:not-allowed;}
  .status{flex:none;font-size:12px;font-weight:700;padding:6px 11px;border-radius:100px;}
  .status.home{background:var(--home);color:#fff;border:1.5px solid var(--home);}
  .status.nearby{background:var(--nearby-soft);color:var(--nearby-text);border:1.5px solid var(--nearby);}
  .status.away{background:var(--surface);color:var(--away);border:1.5px dashed var(--away);}
  .card.clickable{cursor:pointer;}
  .status-switch{display:flex;gap:8px;margin:18px 0 6px;}
  .status-switch button{flex:1;padding:12px 6px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;}
  .status-switch button.active-home{border:2.5px solid var(--home);color:#fff;background:var(--home);}
  .status-switch button.active-nearby{border:2.5px solid var(--nearby);color:var(--nearby-text);background:var(--nearby-soft);}
  .status-switch button.active-away{border:2.5px dashed var(--away);color:var(--away);background:var(--surface);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-card{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom, 0px));}
  .modal-title{font-size:16px;font-weight:700;margin:0 0 4px;}
  .modal-sub{font-size:12.5px;color:var(--text-faint);margin:0 0 16px;line-height:1.6;}
  .modal-btn{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:none;background:var(--surface-sand);font-size:14.5px;font-weight:600;color:var(--text);margin-bottom:8px;cursor:pointer;}
  .modal-cancel{background:transparent;color:var(--text-faint);text-align:center;font-weight:700;margin-top:4px;}
  .section-title{font-size:11.5px;font-weight:700;color:var(--text-faint);letter-spacing:.04em;margin:24px 4px 8px;text-transform:uppercase;}
  .settings-card{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .row + .row{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .row-title{font-size:14px;font-weight:600;}
  .row-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .switch{position:relative;width:44px;height:26px;flex:none;border-radius:100px;background:var(--away-soft);border:1px solid var(--border);cursor:pointer;}
  .switch.on{background:var(--accent);border-color:transparent;}
  .switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s ease;}
  .switch.on .knob{transform:translateX(18px);}
  .footnote{font-size:11.5px;color:var(--text-faint);text-align:center;margin-top:22px;line-height:1.7;}
  .toast{position:fixed;left:20px;right:20px;bottom:24px;max-width:440px;margin:0 auto;background:var(--text);color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;text-align:center;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s ease, transform .2s ease;}
  .toast.show{opacity:1;transform:translateY(0);}
  .copy-btn{flex:none;border:1.5px solid var(--border);background:transparent;color:var(--text);border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .shortcut-steps{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;line-height:1.7;}
  .shortcut-steps summary{font-weight:700;cursor:pointer;}
  .shortcut-steps ol{padding-left:20px;margin:8px 0 0;}
  .shortcut-steps ul{padding-left:18px;margin:4px 0;}
  [hidden]{display:none !important;}
</style><body><div class="page">
<h1>見本</h1><div class="status-switch"><button type="button" class="active-home">在宅</button><button type="button" class="">施設内</button><button type="button" class="">外出中</button></div><div class="status-switch"><button type="button" class="">在宅</button><button type="button" class="active-nearby">施設内</button><button type="button" class="">外出中</button></div><div class="status-switch"><button type="button" class="">在宅</button><button type="button" class="">施設内</button><button type="button" class="active-away">外出中</button></div><div style="height:12px"></div>
<div class="card"><div class="avatar home">さ</div><div class="info"><div class="name-row">さ</div><div class="time">在宅 · 11/19(木) 09:12に帰宅</div></div><div class="status home">在宅</div></div><div class="card"><div class="avatar nearby">父</div><div class="info"><div class="name-row">父</div><div class="time">施設内 · 11/19(木) 08:40から</div></div><div class="status nearby">施設内</div></div><div class="card"><div class="avatar away">母</div><div class="info"><div class="name-row">母</div><div class="time">外出中 · 11/19(木) 07:55に外出</div></div><div class="status away">外出中</div></div>
</div></body>
